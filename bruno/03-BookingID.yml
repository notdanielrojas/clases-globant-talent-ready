info:
  name: 03-BookingID
  type: http
  seq: 3

http:
  method: GET
  url: "{{basicUrl}}/booking/{{createdId}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('validar codigo 200 exitoso', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('validar nombre creado de forma dinamica', function () {
          const data = res.getBody();
          
          const nombreEsperado = bru.getVar("expected_firstname");
          const apellidoEsperado = bru.getVar("expected_lastname");

          expect(data.firstname).to.equal(nombreEsperado);
          expect(data.lastname).to.equal(apellidoEsperado);
        });

        test('validar precio de forma dinamica', function () {
          const data = res.getBody();
          
          const precioEsperado = bru.getVar("expected_totalprice");

          expect(data.totalprice).to.equal(precioEsperado);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
