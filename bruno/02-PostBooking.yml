info:
  name: 02-PostBooking
  type: http
  seq: 2

http:
  method: POST
  url: "{{basicUrl}}/booking"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
          "firstname" : "{{randomFirstname}}",
          "lastname" : "{{randomLastname}}",
          "totalprice" : 182,
          "depositpaid" : true,
          "bookingdates" : {
              "checkin" : "2026-01-01",
              "checkout" : "2027-01-01"
          },
          "additionalneeds" : "Breakfast"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const nombres = ['Daniel', 'Carlos', 'Ana', 'Maria', 'Pedro', 'Laura'];
        const apellidos = ['Rojas', 'Gomez', 'Perez', 'Silva', 'Torres', 'Vargas'];

        const randomFirstname = nombres[Math.floor(Math.random() * nombres.length)];
        const randomLastname = apellidos[Math.floor(Math.random() * apellidos.length)];

        // Usar bru.setVar en lugar de req.setVar
        bru.setVar('randomFirstname', randomFirstname);
        bru.setVar('randomLastname', randomLastname);

    - type: after-response
      code: |-
        const data = res.getBody();

        // Asignación de variables globales de Bruno
        bru.setVar('createdId', data.bookingid);
        bru.setVar('expected_firstname', data.booking.firstname);
        bru.setVar('expected_lastname', data.booking.lastname);
        bru.setVar('expected_depositpaid', data.booking.depositpaid);
        bru.setVar('expected_additionalneeds', data.booking.additionalneeds);

    - type: tests
      code: |-
        test('Validar creación exitosa (Status 200)', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('Validar estructura del nuevo registro', function () {
          const data = res.getBody();
          
          expect(data.bookingid).to.be.a('number');
          expect(data.booking.firstname).to.be.a('string');
          expect(data.booking.totalprice).to.be.a('number');
          expect(data.booking.bookingdates).to.be.an('object');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5