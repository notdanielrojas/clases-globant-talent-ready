info:
  name: 01-CreateToken
  type: http
  seq: 1

http:
  method: POST
  url: "{{basicUrl}}/auth"
  body:
    type: json
    data: |-
      {
        "username": {{username}},
        "password": {{password}}
      }
  auth: inherit

runtime:
  variables:
    - name: username
      value: '"admin"'
    - name: password
      value: '"password123"'
  scripts:
    - type: tests
      code: |-
        test('validar codigo 200 exitoso', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('validar que exista token', function () {
          expect(res.getBody()).to.have.property('token');
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: AuthToken
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
