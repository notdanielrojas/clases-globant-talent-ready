info:
  name: 03-BookingID
  type: http
  seq: 3

http:
  method: GET
  url: "{{basicUrl}}/booking/{{createdId}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Validar estado de respuesta exitoso (200 OK)', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('validar nombre creado de forma dinamica', function () {
          const data = res.getBody();
          const expectedFirstname = bru.getVar('expected_firstname');
          expect(data.firstname).to.equal(expectedFirstname);
        });

        test('validar apellido creado de forma dinamica', function () {
          const data = res.getBody();
          const expectedLastname = bru.getVar('expected_lastname');
          expect(data.lastname).to.equal(expectedLastname);
        });

        test('validar depositpaid de forma dinamica', function () {
          const data = res.getBody();
          const expectedDepositPaid = bru.getVar('expected_depositpaid');
          expect(data.depositpaid).to.equal(expectedDepositPaid);
        });

        test('validar additionalneeds de forma dinamica', function () {
          const data = res.getBody();
          const expectedAdditionalNeeds = bru.getVar('expected_additionalneeds');
          expect(data.additionalneeds).to.equal(expectedAdditionalNeeds);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5